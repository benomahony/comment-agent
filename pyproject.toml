[project]
name = "comment-agent"
version = "0.1.0"
description = "A language server that reviews code on save, leaves TODO/FIXME/PERF comments, and hands them to Claude Code"
readme = "README.md"
authors = [
    { name = "benomahony", email = "bomarni@googlemail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-slim[anthropic]>=2.57.0",
    "pygls>=2.1.1",
]

[project.scripts]
comment-agent = "comment_agent:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "S101",  # zanity's assertion-density rule requires asserts in every function; S101 forbids them
]
